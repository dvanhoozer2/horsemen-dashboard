<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season 10 Leaderboard</title>
<style>
  /* ── Design tokens — dark (default) ── */
  :root {
    --bg:        #0e1116;
    --panel:     #161b22;
    --panel-2:   #1d232c;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --border:    #2a313c;
    --gold:      #f5c518;
    --gold-soft: rgba(245, 197, 24, 0.12);
    --gold-edge: rgba(245, 197, 24, 0.45);
    --accent:    #4ea1ff;
    --up:        #3fb950;
    --down:      #f85149;
    --radius:    10px;
  }

  /* ── Light theme tokens ── */
  :root.light {
    --bg:        #f4f6f9;
    --panel:     #ffffff;
    --panel-2:   #eef0f4;
    --text:      #111827;
    --muted:     #4b5563;
    --border:    #d1d5db;
    --gold:      #92700a;
    --gold-soft: rgba(146, 112, 10, 0.10);
    --gold-edge: rgba(146, 112, 10, 0.40);
    --accent:    #1d6fd8;
    --up:        #15803d;
    --down:      #dc2626;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 24px 16px 60px;
  }

  /* ── Page header ── */
  .page-header {
    max-width: 860px;
    margin: 0 auto 28px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .page-header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ── Search ── */
  .search-wrap {
    max-width: 860px;
    margin: 0 auto 16px;
  }
  #search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;   /* 16px+ stops iPhone Safari from zooming in on tap */
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  /* Banner shown when a player outside top-10 is searched */
  #search-banner {
    display: none;
    margin-top: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 13px;
    color: var(--muted);
  }
  #search-banner strong { color: var(--text); }

  /* ── Table panel ── */
  .table-wrap {
    max-width: 860px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  thead th.col-total,
  thead th.col-avg  { text-align: right; }

  /* ── Table rows ── */
  .player-row {
    cursor: pointer;
    transition: background .12s;
    border-bottom: 1px solid var(--border);
  }
  .player-row:last-of-type { border-bottom: none; }
  .player-row:hover { background: var(--panel-2); }

  /* Gold highlight for playoff spots */
  .player-row.gold-row {
    border-left: 3px inset var(--gold-edge);
    background: var(--gold-soft);
  }
  .player-row.gold-row:hover { background: rgba(245,197,24,.18); }

  /* Row that was expanded via search or click */
  .player-row.highlighted {
    outline: 1px solid var(--accent);
    outline-offset: -1px;
  }

  td {
    padding: 11px 14px;
    vertical-align: middle;
  }
  .col-rank  { font-size: 17px; width: 52px; }
  .col-move  { width: 68px; }
  .col-total, .col-avg { text-align: right; }
  .col-weeks { text-align: center; color: var(--muted); font-size: 13px; }
  .col-avg   { color: var(--muted); font-size: 13px; }

  /* Row hidden by search filter */
  .player-row.hidden, .chart-row.hidden { display: none !important; }

  /* ── Movement pills ── */
  .pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    border-radius: 20px;
    padding: 2px 7px;
    white-space: nowrap;
  }
  .pill-up   { background: rgba(63,185,80,.15);  color: var(--up); }
  .pill-down { background: rgba(248,81,73,.15);  color: var(--down); }
  .pill-same { background: var(--panel-2); color: var(--muted); }
  .pill-new  { background: rgba(78,161,255,.15); color: var(--accent); }

  /* ── Expanded chart row ── */
  .chart-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .chart-wrap {
    padding: 16px 20px 20px;
    background: var(--panel-2);
  }
  .rank-chart { width: 100%; height: 200px; display: block; }
  @media (max-width: 600px) {
    .chart-wrap  { padding: 12px 6px 14px; }
    .rank-chart  { height: 230px; }
  }

  /* ── Theme toggle button ── */
  #theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 6px 12px;
    z-index: 100;
    transition: background .15s, color .15s;
  }
  #theme-toggle:hover { color: var(--text); background: var(--panel-2); }

  /* ── Mobile: hide Weeks and Avg/Wk columns, tighten layout ── */
  @media (max-width: 560px) {
    .hide-mobile { display: none; }

    /* Tighter cell padding on small screens */
    td, thead th { padding: 10px 8px; }

    /* Let the player name column absorb extra space */
    .col-name { word-break: break-word; }

    /* Slightly smaller rank emoji/number */
    .col-rank { font-size: 15px; width: 40px; }

    /* Slightly larger total so it's easy to read */
    .col-total { font-size: 14px; font-weight: 600; color: var(--text); }

    /* Search banner wraps nicely on small screens */
    #search-banner { font-size: 12px; }
  }

  /* ── Last week's results button + popup ── */
  .header-actions { margin-top: 14px; }
  .lw-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--gold-edge); background: var(--gold-soft);
    color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .lw-btn:hover { border-color: var(--gold); }
  .lw-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .lw-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  .lw-overlay.open { display: flex; }
  .lw-modal {
    position: relative; width: 100%; max-width: 420px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    padding: 20px 20px 18px;
  }
  .lw-close {
    position: absolute; top: 10px; right: 10px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .lw-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lw-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--gold);
  }
  .lw-title { font-size: 20px; font-weight: 700; margin: 2px 44px 14px 0; }
  .lw-list { list-style: none; border-top: 1px solid var(--border); }
  .lw-list li {
    display: grid; grid-template-columns: 92px 1fr; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .lw-label { font-size: 12px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--muted); padding-top: 2px; }
  .lw-names { font-weight: 600; }
  .lw-names .lw-pts { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
  .lw-names .lw-none { color: var(--muted); font-weight: 400; }
  .lw-msg { color: var(--muted); padding: 12px 0; }
  body.lw-locked { overflow: hidden; }
</style>
</head>
<body>

<button id="theme-toggle" onclick="toggleTheme()">☾ Dark</button>

<!-- ══════════════════════════════════════════════
     PAGE HEADER
══════════════════════════════════════════════ -->
<header class="page-header">
  <p class="eyebrow">Derby Standings</p>
  <h1>Season 10 Leaderboard</h1>
  <p class="meta" id="meta-line">Loading standings…</p>
  <p class="meta">Click on a player's name to see week by week ranking</p>
  <div class="header-actions">
    <button type="button" class="lw-btn" id="lw-open">🏆 Last Week's Results</button>
  </div>
</header>

<!-- Last week's results popup -->
<div class="lw-overlay" id="lw-overlay" aria-hidden="true">
  <div class="lw-modal" role="dialog" aria-modal="true" aria-labelledby="lw-title">
    <button type="button" class="lw-close" id="lw-close" aria-label="Close">×</button>
    <p class="lw-eyebrow">Last Week's Results</p>
    <h2 class="lw-title" id="lw-title">Loading…</h2>
    <div id="lw-body"><p class="lw-msg">Loading…</p></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     SEARCH BAR
══════════════════════════════════════════════ -->
<div class="search-wrap">
  <input id="search" type="search" placeholder="Search player…" autocomplete="off">
  <div id="search-banner"></div>
</div>

<!-- ══════════════════════════════════════════════
     LEADERBOARD TABLE
══════════════════════════════════════════════ -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="col-rank">Rank</th>
        <th class="col-move">Move</th>
        <th class="col-name">Player</th>
        <th class="col-total">Total</th>
        <th class="col-weeks hide-mobile">Weeks</th>
        <th class="col-avg hide-mobile">Avg/Wk</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <tr><td colspan="6" style="text-align:center;padding:24px;opacity:.7">Loading standings…</td></tr>
    </tbody>
  </table>
</div>

<!-- ══════════════════════════════════════════════
     JAVASCRIPT — search, row expansion, charts
══════════════════════════════════════════════ -->
<script>
// ── Theme toggle ────────────────────────────────────────────────────
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('theme-toggle').textContent = isLight ? '☾ Dark' : '☀ Light';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Restore saved theme on load — default is light
(function() {
  const saved = localStorage.getItem('theme');
  if (saved !== 'dark') {
    document.documentElement.classList.add('light');
    document.getElementById('theme-toggle').textContent = '☾ Dark';
  }
})();

// ── Live data source ────────────────────────────────────────────────
// Reads the RawData tab straight from the Google Sheet. The sheet must be
// shared "Anyone with the link → Viewer". Apps Script keeps it updated.
const SHEET_ID   = '15n9sUTL5phNS2EZLGzlBl4kOcPuNmGsIrhYg6fqddnA';
const SHEET_TAB  = 'RawData';
const SHEET_CSV  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
const CACHE_KEY  = 'horsemen-rawdata-v1';

let WEEK_LABELS = [];
const PLAYOFF_SPOTS = 10;

// ── Utility: find the 10th-place total points ────────────────────────
function getTenthPlaceTotal() {
  const rows = [...document.querySelectorAll('.player-row')];
  const row10 = rows[PLAYOFF_SPOTS - 1];
  return row10 ? parseFloat(row10.dataset.total) : 0;
}

// ── Chart drawing (pure Canvas, no dependencies) ─────────────────────
function drawChart(canvasEl, ranks, scores, color) {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvasEl.offsetWidth  || 800;
  const H   = canvasEl.offsetHeight || 200;

  canvasEl.width  = W * dpr;
  canvasEl.height = H * dpr;

  const ctx = canvasEl.getContext('2d');
  ctx.scale(dpr, dpr);

  // Filter to weeks where the player has a rank
  const dataPoints = [];
  for (let i = 0; i < ranks.length; i++) {
    if (ranks[i] !== null) {
      dataPoints.push({ weekIdx: i, rank: ranks[i] });
    }
  }

  if (dataPoints.length < 1) return;

  // Axis bounds — rank 1 at top, worst rank at bottom
  const allRanks = dataPoints.map(d => d.rank);
  const minRank  = 1;
  const maxRank  = Math.max(...allRanks, PLAYOFF_SPOTS);

  // Chart padding
  // Compact axis when weeks are packed tightly (phones)
  const weeksSpan = Math.max(WEEK_LABELS.length - 1, 1);
  const compact   = (W - 56) / weeksSpan < 48;
  const stagger   = (W - 40) / weeksSpan < 34;
  const PAD = compact
    ? { top: 26, right: 14, bottom: stagger ? 58 : 46, left: 26 }
    : { top: 28, right: 24, bottom: 50, left: 32 };
  const chartW = W - PAD.left - PAD.right;
  const chartH = H - PAD.top  - PAD.bottom;

  // Convert data point → pixel position
  // Rank 1 = top of chart (low Y), higher rank number = lower on chart
  function toX(weekIdx) {
    const totalWeeks = WEEK_LABELS.length - 1 || 1;
    return PAD.left + (weekIdx / totalWeeks) * chartW;
  }
  function toY(rank) {
    const span = maxRank - minRank || 1;
    return PAD.top + ((rank - minRank) / span) * chartH;
  }

  // Detect light/dark mode for chart colors
  const isLight  = document.documentElement.classList.contains('light');
  const gridColor  = isLight ? 'rgba(180,185,195,0.6)' : 'rgba(42,49,60,0.8)';
  const labelColor = isLight ? 'rgba(30,30,30,0.85)'   : 'rgba(230,237,243,0.9)';
  const axisColor  = isLight ? 'rgba(100,110,125,0.8)' : 'rgba(139,148,158,0.8)';

  // ── Draw subtle horizontal grid lines ──
  ctx.strokeStyle = gridColor;
  ctx.lineWidth   = 1;
  const gridStep = maxRank > 15 ? 5 : 1;
  for (let r = minRank; r <= maxRank; r++) {
    if (gridStep > 1 && r !== 1 && r % gridStep !== 0 && r !== maxRank) continue;
    const y = toY(r);
    ctx.beginPath();
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + chartW, y);
    ctx.stroke();
  }

  // ── Draw X axis labels (Week N) + score below ──
  // Phones: week number only, scores trimmed and staggered on two rows
  const fmtScore = s => compact ? String(+s.toFixed(2)) : s.toFixed(2);
  const axisY = H - PAD.bottom;
  ctx.textAlign = 'center';
  if (compact) {
    ctx.fillStyle = axisColor;
    ctx.font      = '9px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Wk', PAD.left - 8, axisY + 14);
    ctx.textAlign = 'center';
  }
  dataPoints.forEach((d, i) => {
    const x     = toX(d.weekIdx);
    const score = scores[d.weekIdx];

    ctx.fillStyle = axisColor;
    ctx.font      = '10px -apple-system, sans-serif';
    ctx.fillText(compact ? String(d.weekIdx + 1) : WEEK_LABELS[d.weekIdx], x, axisY + 14);

    if (score > 0) {
      const row = (stagger && d.weekIdx % 2 === 1) ? 1 : 0;
      ctx.fillStyle = labelColor;
      ctx.font      = `bold ${compact ? 9 : 10}px -apple-system, sans-serif`;
      ctx.fillText(fmtScore(score), x, axisY + 28 + row * 12);
    }
  });

  // ── Draw the trend line ──
  ctx.strokeStyle = color;
  ctx.lineWidth   = 2.5;
  ctx.lineJoin    = 'round';
  ctx.beginPath();
  dataPoints.forEach((d, i) => {
    const x = toX(d.weekIdx);
    const y = toY(d.rank);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // ── Draw data point dots + rank labels ──
  dataPoints.forEach((d, i) => {
    const x    = toX(d.weekIdx);
    const y    = toY(d.rank);
    const next = dataPoints[i + 1];

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle   = color;
    ctx.fill();
    ctx.strokeStyle = '#0e1116';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    // Rank label: place ABOVE the dot if the next rank is worse (higher number),
    // or if it's the last point; otherwise place BELOW.
    // Always place rank label above the dot
    ctx.fillStyle  = labelColor;
    ctx.font       = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign  = 'center';
    ctx.fillText(d.rank, x, y - 10);
  });
}

// ── Row click: toggle chart expansion ───────────────────────────────
let openChartId = null;

document.getElementById('leaderboard-body').addEventListener('click', function(e) {
  const row = e.target.closest('.player-row');
  if (!row) return;

  const rank      = [...document.querySelectorAll('.player-row')].indexOf(row) + 1;
  const chartRow  = document.getElementById('chart-' + rank);
  if (!chartRow) return;

  // Close whichever chart is currently open (unless it's this one)
  if (openChartId && openChartId !== rank) {
    const prev = document.getElementById('chart-' + openChartId);
    if (prev) prev.style.display = 'none';
  }

  if (chartRow.style.display === 'none' || chartRow.style.display === '') {
    chartRow.style.display = 'table-row';
    openChartId = rank;

    // Draw the chart on the next frame so the canvas has layout dimensions
    requestAnimationFrame(() => {
      const canvas = document.getElementById('canvas-' + rank);
      const ranks  = JSON.parse(row.dataset.ranks);
      const scores = JSON.parse(row.dataset.scores);
      const color  = row.dataset.color;
      drawChart(canvas, ranks, scores, color);
    });
  } else {
    chartRow.style.display = 'none';
    openChartId = null;
  }
});

// ── Search / filter logic ────────────────────────────────────────────
const searchInput  = document.getElementById('search');
const searchBanner = document.getElementById('search-banner');

searchInput.addEventListener('input', function() {
  const query   = this.value.trim().toLowerCase();
  const allRows = [...document.querySelectorAll('.player-row')];

  // Close any open chart when the query changes
  if (openChartId) {
    const prev = document.getElementById('chart-' + openChartId);
    if (prev) prev.style.display = 'none';
    openChartId = null;
  }

  if (!query) {
    // Show everything, clear banner
    allRows.forEach(r => r.classList.remove('hidden', 'highlighted'));
    document.querySelectorAll('.chart-row').forEach(r => r.classList.remove('hidden'));
    searchBanner.style.display = 'none';
    return;
  }

  // Find matched player
  const matched = allRows.find(r =>
    r.dataset.name.toLowerCase().includes(query)
  );

  const tenthTotal = getTenthPlaceTotal();

  allRows.forEach((row, i) => {
    const rank       = i + 1;   // rows are in rank order
    const isPlayoff  = rank <= PLAYOFF_SPOTS;
    const isMatched  = matched && row === matched;
    const chartRow   = document.getElementById('chart-' + rank);

    if (isPlayoff || isMatched) {
      row.classList.remove('hidden');
      row.classList.toggle('highlighted', isMatched && !isPlayoff);
      if (chartRow) chartRow.classList.remove('hidden');
    } else {
      row.classList.add('hidden');
      if (chartRow) chartRow.classList.add('hidden');
    }
  });

  // Show banner if match is outside top 10
  if (matched) {
    const matchRank  = allRows.indexOf(matched) + 1;
    const matchTotal = parseFloat(matched.dataset.total);
    if (matchRank > PLAYOFF_SPOTS) {
      const behind = (tenthTotal - matchTotal).toFixed(2);
      searchBanner.style.display = 'block';
      searchBanner.innerHTML =
        `<strong>${matched.dataset.name}</strong> is ranked #${matchRank} — ` +
        `<strong>${behind}</strong> pts behind the #${PLAYOFF_SPOTS} playoff spot.`;
    } else {
      searchBanner.style.display = 'none';
    }
  } else {
    searchBanner.style.display = 'none';
  }
});
// ── Load + render ────────────────────────────────────────────────────
function parseCsv(text) {
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); out.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); out.push(row); }
  return out;
}

const DATE_RE = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/;

function buildStandings(csvText) {
  const grid   = parseCsv(csvText);
  const header = grid[0] || [];
  // Week columns = headers that are dates (skips "Player", "Total Derby Points")
  let weekCols = header.map((h, i) => DATE_RE.test(h) ? i : -1).filter(i => i >= 0);

  const players = grid.slice(1)
    .filter(r => (r[0] || '').trim() !== '')
    .map((r, order) => ({
      name: r[0].trim(),
      order,
      all: weekCols.map(c => { const v = parseFloat(r[c]); return isNaN(v) ? 0 : v; })
    }));

  // Only keep weeks that have been played (any player scored)
  const played = weekCols.map((_, w) => players.some(p => p.all[w] > 0));
  const keep   = played.map((v, w) => v ? w : -1).filter(w => w >= 0);
  const dates  = keep.map(w => header[weekCols[w]]);
  players.forEach(p => {
    p.scores = keep.map(w => p.all[w]);
    let run = 0; p.running = p.scores.map(s => (run = Math.round((run + s) * 100) / 100));
    p.total  = p.running.length ? p.running[p.running.length - 1] : 0;
    p.weeks  = p.scores.filter(s => s > 0).length;
    p.ranks  = [];
  });

  // Rank after each week: only players with points so far.
  // Tied totals: if both were ranked the week before, whoever was ahead stays
  // ahead; otherwise sheet order decides.
  const tie = (a, b, w) => {
    const pa = w > 0 ? a.ranks[w - 1] : null, pb = w > 0 ? b.ranks[w - 1] : null;
    return (pa != null && pb != null) ? pa - pb : a.order - b.order;
  };
  keep.forEach((_, w) => {
    players.filter(p => p.running[w] > 0)
      .sort((a, b) => b.running[w] - a.running[w] || tie(a, b, w))
      .forEach((p, i) => { p.ranks[w] = i + 1; });
    players.forEach(p => { if (p.ranks[w] === undefined) p.ranks[w] = null; });
  });

  players.sort((a, b) => (a.ranks[a.ranks.length - 1] ?? 1e9) - (b.ranks[b.ranks.length - 1] ?? 1e9));
  return { players, dates };
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render({ players, dates }) {
  WEEK_LABELS = dates.map((_, i) => 'Week ' + (i + 1));
  const n = dates.length;
  const medals = ['🥇', '🥈', '🥉'];
  const html = players.map((p, i) => {
    const rank = i + 1;
    p.ranks[n - 1] = rank; // keep chart/move consistent with table order
    const playoff = rank <= PLAYOFF_SPOTS;
    const now = p.ranks[n - 1], prev = n > 1 ? p.ranks[n - 2] : null;
    let pill;
    if (prev == null)      pill = '<span class="pill pill-new">NEW</span>';
    else if (prev === now) pill = '<span class="pill pill-same">—</span>';
    else if (prev > now)   pill = `<span class="pill pill-up">▲ ${prev - now}</span>`;
    else                   pill = `<span class="pill pill-down">▼ ${now - prev}</span>`;
    const avg = p.weeks ? (p.total / p.weeks).toFixed(1) : '0.0';
    return `
        <tr class="player-row ${playoff ? 'gold-row' : ''}"
            data-name="${esc(p.name)}"
            data-ranks='${JSON.stringify(p.ranks)}'
            data-scores='${JSON.stringify(p.scores)}'
            data-color="${playoff ? '#f5c518' : '#4ea1ff'}"
            data-total="${p.total.toFixed(2)}">
          <td class="col-rank">${medals[i] || rank}</td>
          <td class="col-move">${pill}</td>
          <td class="col-name">${esc(p.name)}</td>
          <td class="col-total">${p.total.toFixed(2)}</td>
          <td class="col-weeks hide-mobile">${p.weeks}</td>
          <td class="col-avg hide-mobile">${avg}</td>
        </tr>
        <tr class="chart-row" id="chart-${rank}" style="display:none">
          <td colspan="6"><div class="chart-wrap"><canvas class="rank-chart" id="canvas-${rank}"></canvas></div></td>
        </tr>`;
  }).join('');
  document.getElementById('leaderboard-body').innerHTML = html;

  const last = dates[n - 1];
  const m = last ? last.match(DATE_RE) : null;
  const lastStr = m ? new Date(+m[3], +m[1] - 1, +m[2])
      .toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '—';
  document.getElementById('meta-line').innerHTML =
    `Through ${lastStr} (Week ${n}) &nbsp;·&nbsp; ${players.length} players`;
}

async function loadStandings() {
  try {
    const res = await fetch(SHEET_CSV + '&_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (!/^"?Player/i.test(text)) throw new Error('Unexpected sheet response');
    render(buildStandings(text));
    try { localStorage.setItem(CACHE_KEY, text); } catch (e) {}
  } catch (err) {
    let cached = null;
    try { cached = localStorage.getItem(CACHE_KEY); } catch (e) {}
    if (cached) {
      render(buildStandings(cached));
      document.getElementById('meta-line').innerHTML += ' &nbsp;·&nbsp; <em>offline copy</em>';
    } else {
      document.getElementById('leaderboard-body').innerHTML =
        '<tr><td colspan="6" style="text-align:center;padding:24px">Couldn’t load standings right now. Try refreshing in a minute.</td></tr>';
      document.getElementById('meta-line').textContent = 'Standings unavailable';
    }
    console.error('Standings load failed:', err);
  }
}
loadStandings();

// ── Last week's results popup ───────────────────────────────────────
const LW_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=LatestWeek`;
const LW_CACHE_KEY = 'horsemen-latestweek-v1';
const lwOverlay = document.getElementById('lw-overlay');
const lwOpenBtn = document.getElementById('lw-open');

function lwRender(csvText) {
  const grid = parseCsv(csvText);
  const head = (grid[0] || []).map(h => h.trim().toLowerCase());
  const col  = name => head.indexOf(name);
  const iDate = col('week of'), iName = col('player');
  if (iName < 0) throw new Error('LatestWeek tab not in expected format');

  const rows = grid.slice(1).filter(r => (r[iName] || '').trim());
  const pts  = (r, c) => { const v = parseFloat(r[c]); return isNaN(v) ? 0 : v; };
  const winners = c => c < 0 ? [] : rows.filter(r => pts(r, c) > 0)
                                        .map(r => ({ name: r[iName].trim(), pts: pts(r, c) }));

  const m = rows.length && iDate >= 0 ? String(rows[0][iDate]).match(DATE_RE) : null;
  document.getElementById('lw-title').textContent = m
    ? new Date(+m[3], +m[1] - 1, +m[2]).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
    : 'Most recent week';

  const fmt = n => String(+n.toFixed(2));
  const line = (label, list, showPts = true) => {
    const names = list.length
      ? list.map(w => esc(w.name) + (showPts ? `<span class="lw-pts">${fmt(w.pts)} pts</span>` : '')).join('<br>')
      : '<span class="lw-none">—</span>';
    return `<li><span class="lw-label">${label}</span><span class="lw-names">${names}</span></li>`;
  };

  document.getElementById('lw-body').innerHTML = rows.length ? `<ul class="lw-list">
      ${line('Low Gross', winners(col('gross')))}
      ${line('1st',       winners(col('1st')))}
      ${line('2nd',       winners(col('2nd')))}
      ${line('3rd',       winners(col('3rd')))}
      ${line('4th',       winners(col('4th')))}
      ${line('Team',      winners(col('team 1st')), false)}
    </ul>` : '<p class="lw-msg">No results posted yet.</p>';
}

async function lwLoad() {
  try {
    const res = await fetch(LW_CSV + '&_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    lwRender(text);
    try { localStorage.setItem(LW_CACHE_KEY, text); } catch (e) {}
  } catch (err) {
    let cached = null;
    try { cached = localStorage.getItem(LW_CACHE_KEY); } catch (e) {}
    if (cached) { try { lwRender(cached); return; } catch (e) {} }
    document.getElementById('lw-title').textContent = 'Results unavailable';
    document.getElementById('lw-body').innerHTML =
      '<p class="lw-msg">Couldn’t load last week’s results. Try again in a minute.</p>';
    console.error('Last week load failed:', err);
  }
}

function lwOpen() {
  lwOverlay.classList.add('open');
  lwOverlay.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lw-locked');
  document.getElementById('lw-close').focus();
  lwLoad();
}
function lwClose() {
  lwOverlay.classList.remove('open');
  lwOverlay.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lw-locked');
  lwOpenBtn.focus();
}
lwOpenBtn.addEventListener('click', lwOpen);
document.getElementById('lw-close').addEventListener('click', lwClose);
lwOverlay.addEventListener('click', e => { if (e.target === lwOverlay) lwClose(); });   // tap outside
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lwOverlay.classList.contains('open')) lwClose(); });
</script>
